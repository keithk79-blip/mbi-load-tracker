<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Keith's Load Tracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Keith's Load Tracker</title>
    <style>
      html, body, #root { margin: 0; min-height: 100%; height: 100%; background: #fff; color: #111; }
      #boot-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #fff;
        color: #111;
      }
      #boot-fallback img { height: 84px; width: auto; }
      #boot-error { color: #b91c1c; max-width: 28rem; text-align: center; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <img src="/brand/klt-logo.png" alt="Keith's Load Tracker" />
        <div>Starting Keith's Load Tracker…</div>
        <div id="boot-error"></div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var boot = document.getElementById("boot-fallback");
        var err = document.getElementById("boot-error");
        if (boot && err && !err.textContent) {
          err.textContent =
            "Desktop is stuck starting. Run git pull, then npm run tauri build, and install the new setup.exe.";
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
