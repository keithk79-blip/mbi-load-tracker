[package]
name = "load-tracker"
version = "1.0.0"
description = "CHItrader Load Tracker desktop shell"
authors = ["CHItrader"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "load_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
